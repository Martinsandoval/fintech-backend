spring.application.name=fintech
spring.flyway.repair-on-migrate=true
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fintech_db}?stringtype=unspecified
spring.datasource.username=${PGUSER:martinsandoval}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.default-produces-media-type=application/json

spring.cache.type=caffeine
# El caché activo es Caffeine (in-process), no Redis. spring-boot-starter-data-redis
# sigue en el classpath pero nada lo usa todavía; sin esto, el health indicator
# de Redis auto-configurado tira /actuator/health a DOWN por un servidor que
# la app ni siquiera necesita.
management.health.redis.enabled=false
# Primer uso real del cache de Caffeine — ver feature-specs/5-revocacion-tokens.md.
spring.cache.cache-names=tokens-revocados
spring.cache.caffeine.spec=expireAfterWrite=60s,maximumSize=10000

app.jwt.secret=${JWT_SECRET:lKxDXIU3fUTvwL0RIwfw8DgZ1lzU4DevHZh2MNlACXw=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
# Limpieza de tokens_revocados vencidos — ver feature-specs/5-revocacion-tokens.md.
app.security.tokens-revocados.limpieza-intervalo-ms=${TOKENS_REVOCADOS_LIMPIEZA_INTERVALO_MS:3600000}

# Rate limiting por IP en /api/auth/login y /api/auth/register — ver
# feature-specs/7-rate-limiting.md.
app.security.rate-limit.login.max-intentos=${RATE_LIMIT_LOGIN_MAX_INTENTOS:10}
app.security.rate-limit.login.ventana-segundos=${RATE_LIMIT_LOGIN_VENTANA_SEGUNDOS:300}

# Cifrado a nivel de campo (ver feature-specs/3-cifrado.md). Default de
# desarrollo — en producción tiene que venir de un secrets manager, no de
# una property en texto plano.
app.encryption.field-key=${FIELD_ENCRYPTION_KEY:ZfukRoTP73XQyi+tgiygJUaxmlV7YHWz4iNnDwgp79A=}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# AWS — región fija para dev local; el SDK por defecto la busca en
# variables de entorno/perfil/metadata de EC2 y falla el boot si no
# encuentra ninguna. En otros ambientes, override con AWS_REGION.
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}

# OAuth2 — Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Redirect URI after OAuth2 login (frontend URL that receives the JWT)
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/callback}


# Sagas — scoring Nosis (ver feature-specs/2-implementar-sagas.md).
# Umbral/intervalo cortos a propósito para que el camino de reconciliación
# sea visible en dev sin esperar minutos; en producción deberían ser mucho
# más largos.
app.integraciones.nosis.simular-falla-primer-intento=${NOSIS_SIMULAR_FALLA:true}
app.scoring.reconciliacion.umbral-segundos=${SCORING_RECONCILIACION_UMBRAL_SEGUNDOS:5}
app.scoring.reconciliacion.intervalo-ms=${SCORING_RECONCILIACION_INTERVALO_MS:10000}

# Multipart upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
